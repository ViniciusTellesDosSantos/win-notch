<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>win-notch</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="notch.css" />
  </head>
  <body>
    <div id="notch" class="edge-top" data-state="collapsed">
      <div id="pill">
        <svg id="pill-ring" data-state="loading" viewBox="0 0 32 32" width="22" height="22">
          <circle class="track" cx="16" cy="16" r="12" />
          <circle id="pill-ring-progress" class="progress" cx="16" cy="16" r="12" />
        </svg>
      </div>

      <div id="panel">
        <header id="panel-header">
          <span id="panel-title">Claude Code</span>
          <span id="header-dot" data-state="loading"></span>
        </header>

        <div id="usage-row">
          <svg id="usage-ring" viewBox="0 0 64 64" width="56" height="56">
            <circle class="ring-track" cx="32" cy="32" r="27" />
            <circle id="ring-progress" class="ring-progress" cx="32" cy="32" r="27" />
          </svg>
          <div id="usage-info">
            <div id="usage-primary">Carregando…</div>
            <div id="usage-secondary" class="muted"></div>
          </div>
        </div>

        <p id="usage-footnote" class="muted small"></p>

        <div id="divider"></div>

        <button id="capture-btn" type="button">
          <svg id="capture-icon" viewBox="0 0 16 16" width="14" height="14" fill="none">
            <path d="M1 5V2a1 1 0 0 1 1-1h3" />
            <path d="M11 1h3a1 1 0 0 1 1 1v3" />
            <path d="M15 11v3a1 1 0 0 1-1 1h-3" />
            <path d="M5 15H2a1 1 0 0 1-1-1v-3" />
          </svg>
          Capturar região
        </button>
        <p id="capture-message" class="small"></p>

        <p id="calendar-placeholder" class="muted small">Agenda: em breve</p>
        <p id="freshness" class="muted tiny"></p>
      </div>
    </div>

    <script src="notch.js"></script>
  </body>
</html>
