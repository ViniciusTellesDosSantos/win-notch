<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>win-notch</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="popover.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="spark" viewBox="0 0 24 24">
        <path
          d="M12.29 9.62L13.22 1.87M13.63 10.24L17.85 5.70M14.35 11.54L22.01 10.03M14.18 13.01L19.80 15.62M13.17 14.10L16.96 20.91M11.71 14.38L10.97 20.54M10.37 13.76L5.06 19.47M9.65 12.46L3.56 13.66M9.82 10.99L2.75 7.71M10.83 9.90L7.81 4.49"
          fill="none"
          stroke="currentColor"
          stroke-width="2.1"
          stroke-linecap="round"
        />
      </symbol>
    </svg>

    <div id="root" class="edge-top">
      <div id="popover">
        <header id="popover-header">
          <svg class="header-spark" width="18" height="18"><use href="#spark" /></svg>
          <span id="popover-title">Uso do Claude</span>
          <button id="update-btn" type="button" aria-label="Atualizar" hidden>
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
              <path d="M8 2v8" />
              <path d="M4.5 6.5 8 10l3.5-3.5" />
              <path d="M3 13.5h10" />
            </svg>
          </button>
          <button id="capture-btn" type="button" title="Capturar região" aria-label="Capturar região">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
              <path d="M1 5V2a1 1 0 0 1 1-1h3" />
              <path d="M11 1h3a1 1 0 0 1 1 1v3" />
              <path d="M15 11v3a1 1 0 0 1-1 1h-3" />
              <path d="M5 15H2a1 1 0 0 1-1-1v-3" />
            </svg>
          </button>
        </header>

        <section class="usage-line">
          <div class="line-head">
            <span class="line-label">Sessão atual</span>
            <span id="session-reset" class="line-reset"></span>
          </div>
          <div class="bar"><div id="session-fill" class="bar-fill" data-level="ok"></div></div>
          <div id="session-used" class="line-used">Carregando…</div>
        </section>

        <section id="weekly-line" class="usage-line" hidden>
          <div class="line-head">
            <span class="line-label">Todos os modelos</span>
            <span id="weekly-reset" class="line-reset"></span>
          </div>
          <div class="bar"><div id="weekly-fill" class="bar-fill" data-level="ok"></div></div>
          <div id="weekly-used" class="line-used"></div>
        </section>

        <section id="captures">
          <div class="captures-head">
            <span>Capturas recentes</span>
            <button id="open-folder" type="button">Abrir pasta</button>
          </div>
          <div id="capture-list"></div>
        </section>

        <p id="usage-footnote"></p>
      </div>
    </div>

    <script src="usage-format.js"></script>
    <script src="popover.js"></script>
  </body>
</html>
