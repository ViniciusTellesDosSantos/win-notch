<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>win-notch — captura</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.14);
        cursor: crosshair;
        -webkit-user-select: none;
        user-select: none;
        font-family:
          "Segoe UI Variable",
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      #hint {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12.5px;
        background: rgba(0, 0, 0, 0.5);
        padding: 7px 14px;
        border-radius: 8px;
        pointer-events: none;
      }

      #selection-rect {
        position: absolute;
        display: none;
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.28);
        pointer-events: none;
      }

      #dimension-label {
        position: absolute;
        display: none;
        padding: 3px 7px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 11px;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="hint">Arraste para selecionar · Esc para cancelar</div>
    <div id="selection-rect"></div>
    <div id="dimension-label"></div>
    <script src="selection.js"></script>
  </body>
</html>
