[package]
name = "win-notch"
version = "0.1.0"
edition = "2021"
description = "Overlay estilo notch para Windows: uso do Claude Code e captura de tela rápida."

[[bin]]
name = "win-notch"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
] }
tray-icon = "0.19"
auto-launch = "0.5"
arboard = "3"
xcap = "0.0.14"

[dev-dependencies]
tempfile = "3"
