[package]
name = "win-notch"
version = "0.1.0"
description = "Overlay estilo notch para Windows: uso do Claude Code e captura de tela rápida."
edition = "2021"

[lib]
name = "win_notch_lib"
# Desktop-only app, so just rlib for the "main.rs binary links this lib crate" split —
# no need for staticlib/cdylib (those are for mobile/FFI consumers), and cdylib in
# particular makes the linker emit a DLL export table that mingw-w64's ld chokes on
# ("export ordinal too large") given how many symbols Tauri's dependency tree exports.
crate-type = ["rlib"]

[[bin]]
name = "win-notch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
auto-launch = "0.5"
arboard = "3"
xcap = "0.0.14"
# rustls instead of the default native-tls backend: pure-Rust TLS, no OpenSSL to link
# against — matters here because that linking is painful/unreliable when cross-compiling
# with mingw-w64 rather than building on a real Windows host.
ureq = { version = "2", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
